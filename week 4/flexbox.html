<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mondriaan Matin</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .painting {
            display: flex;
            flex-wrap: wrap;
            width: 50vh;
            height: 50vh;
            border: 5px solid black;
        }

        .row {
            display: flex;
            width: 100%;
        }

        .cell {
            flex: 1;
            border: 1px solid green;
        }

        .third {
            flex: 0 0 33.3333%;
        }
        .stack {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .stack .row {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="painting">
    <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>

    </div>
    <div class="row">
        <div class="cell third"></div>

        <div class="stack">
            <div class="row">
                <div class="cell"></div>
            </div>
            <div class="row">
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </div>

    </div>
    <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

</div>
</body>
</html>
